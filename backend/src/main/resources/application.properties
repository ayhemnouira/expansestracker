spring.application.name=expense-tracker

# ======================
# Server Configuration
# ======================
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=always
server.error.include-binding-errors=always

# ======================
# Database Configuration
# ======================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/expense-tracker}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:Root2000&&}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIKARI CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# ======================
# JPA / Hibernate
# ======================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ======================
# JWT
# ======================
jwt.secret=${JWT_SECRET:DWLJCnyNI+BS4jjJQ0a62dbhFsG1eSDLAahACGdzXtm7yter6cjb+mRjDI001UPbvpuNatH7FEHCxhG6MsX6uQ==}
jwt.access-token-validity=86400000
jwt.refresh-token-validity=604800000

# ======================
# CORS
# ======================
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ======================
# Actuator (Health Check)
# ======================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ======================
# Logging
# ======================
logging.level.root=INFO
logging.level.com.example.backend=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ======================
# Production optimizations
# ======================
server.compression.enabled=true
server.http2.enabled=true

#mail settings
# ======================
# EMAIL CONFIGURATION (Same as TradeTide)
# ======================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tradetide85@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mwumvxwrfqspsfcr}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Custom email settings for ExpensesTracker
app.mail.from=${MAIL_FROM:noreply@expensestracker.tn}
app.mail.enabled=${MAIL_ENABLED:true}

# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true