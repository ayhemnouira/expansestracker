spring.application.name=expense-tracker

# ======================
# INSTRUCTIONS:
# 1. Copy this file to application.properties
# 2. Replace all placeholder values with real ones
# 3. Never commit application.properties to Git
# ======================

# ======================
# Server Configuration
# ======================
server.port=${PORT:8080}
server.address=0.0.0.0

# ======================
# Database Configuration
# ======================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/expensetracker}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ======================
# JPA / Hibernate
# ======================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ======================
# JWT (CHANGE THESE!)
# ======================
jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_STRING}
jwt.access-token-validity=86400000
jwt.refresh-token-validity=604800000

# ======================
# CORS
# ======================
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000}

# ======================
# EMAIL CONFIGURATION (CHANGE THESE!)
# ======================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@example.com}

# ======================
# File Upload
# ======================
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB